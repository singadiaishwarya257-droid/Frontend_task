<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dynamic Data Table</title>
	<style>
		:root {
			color-scheme: light;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: #eef4f1;
			color: #19332d;
		}

		body {
			min-height: 100vh;
			margin: 0;
			padding: 3rem 1rem;
			box-sizing: border-box;
		}

		main {
			width: min(100%, 62rem);
			margin: 0 auto;
		}

		header {
			margin-bottom: 1.75rem;
		}

		h1 {
			margin: 0 0 0.4rem;
			font-size: clamp(1.8rem, 4vw, 2.7rem);
		}

		.subtitle {
			margin: 0;
			color: #547069;
		}

		.entry-form,
		.table-wrap {
			border: 1px solid #c9dcd5;
			border-radius: 0.75rem;
			background: #ffffff;
			box-shadow: 0 0.8rem 2rem rgb(25 51 45 / 8%);
		}

		.entry-form {
			display: grid;
			grid-template-columns: 1.1fr 1.3fr 1fr auto;
			gap: 1rem;
			align-items: end;
			padding: 1.25rem;
			margin-bottom: 1.5rem;
		}

		.field {
			display: grid;
			gap: 0.45rem;
		}

		label {
			font-size: 0.85rem;
			font-weight: 700;
		}

		input,
		select,
		button {
			box-sizing: border-box;
			min-height: 2.7rem;
			padding: 0.65rem 0.75rem;
			border: 1px solid #abc4bc;
			border-radius: 0.4rem;
			font: inherit;
		}

		input:focus-visible,
		select:focus-visible,
		button:focus-visible {
			outline: 3px solid #a8d5c5;
			outline-offset: 2px;
		}

		button {
			border-color: #176b57;
			background: #176b57;
			color: #ffffff;
			font-weight: 700;
			cursor: pointer;
		}

		button:hover {
			background: #115443;
		}

		.table-wrap {
			overflow-x: auto;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			min-width: 36rem;
		}

		th,
		td {
			padding: 1rem 1.25rem;
			border-bottom: 1px solid #e0ebe7;
			text-align: left;
		}

		th {
			background: #f5faf8;
			color: #547069;
			font-size: 0.78rem;
			letter-spacing: 0.04em;
			text-transform: uppercase;
		}

		tbody tr:last-child td {
			border-bottom: 0;
		}

		#empty-message {
			padding: 2rem;
			color: #547069;
			text-align: center;
		}

		@media (max-width: 700px) {
			body {
				padding-top: 2rem;
			}

			.entry-form {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<main>
		<header>
			<h1>Team directory</h1>
			<p class="subtitle">Add people to the table as you collect their details.</p>
		</header>

		<form class="entry-form" id="entry-form">
			<div class="field">
				<label for="name">Name</label>
				<input id="name" name="name" type="text" placeholder="Jordan Lee" required>
			</div>
			<div class="field">
				<label for="email">Email</label>
				<input id="email" name="email" type="email" placeholder="jordan@example.com" required>
			</div>
			<div class="field">
				<label for="role">Role</label>
				<select id="role" name="role" required>
					<option value="">Choose a role</option>
					<option>Designer</option>
					<option>Developer</option>
					<option>Manager</option>
					<option>Researcher</option>
				</select>
			</div>
			<button type="submit">Add row</button>
		</form>

		<section class="table-wrap" aria-label="Team members">
			<table>
				<thead>
					<tr>
						<th scope="col">Name</th>
						<th scope="col">Email</th>
						<th scope="col">Role</th>
					</tr>
				</thead>
				<tbody id="table-body"></tbody>
			</table>
			<p id="empty-message">No team members added yet.</p>
		</section>
	</main>

	<script>
		const entryForm = document.querySelector("#entry-form");
		const tableBody = document.querySelector("#table-body");
		const emptyMessage = document.querySelector("#empty-message");

		entryForm.addEventListener("submit", (event) => {
			event.preventDefault();

			const formData = new FormData(entryForm);
			const row = document.createElement("tr");

			["name", "email", "role"].forEach((fieldName) => {
				const cell = document.createElement("td");
				cell.textContent = formData.get(fieldName);
				row.append(cell);
			});

			tableBody.append(row);
			emptyMessage.hidden = true;
			entryForm.reset();
			entryForm.elements.name.focus();
		});
	</script>
</body>
</html>
